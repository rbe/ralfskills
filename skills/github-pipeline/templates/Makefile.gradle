# Gradle app delivered as a container image and a GitHub release of the JAR.
# Make contract: project-setup. help is the default goal. The target
# names are setup, build, test, editorconfig, format, lint, integration,
# coverage, docs, and login. Gradle, npm, Podman,
# python, and tar run inside those targets. The Gradle case is build:
# that target runs Gradle. The workflow runs `make build`.
# GitHub makefile: include sdlc.mk from the installed skill before any
# target. sdlc.mk already defines help, so leave project.mk out.
# sdlc.mk adds version, publish tags, cleanup, and report.
# A repo that does not publish a release deletes publish-github below and
# drops it from SDLC_JOBS.

NAME ?= app
OWNER ?= owner
IMAGE_NAME ?= ghcr.io/$(OWNER)/$(NAME)
IMAGE ?= $(IMAGE_NAME)
PACKAGE ?= $(OWNER)/$(NAME)
KEEP_VERSIONS ?= 2
SDLC_JOBS ?= setup build test docs publish-container publish-github

JDK_IMAGE ?= docker.io/library/eclipse-temurin:25-jdk
JRE_IMAGE ?= docker.io/library/eclipse-temurin:25-jre
CI_IMAGE ?= localhost/$(NAME):ci
JAR_GLOB ?= build/libs/$(NAME)-*.jar
# Host JDK: set GRADLE=./gradlew and record that under Divergences.
GRADLE ?= podman run --rm -e CI -e GRADLE_USER_HOME=/gradle -v "$$HOME/.gradle":/gradle:Z -v "$(CURDIR)":/work:Z -w /work $(JDK_IMAGE) ./gradlew --console=plain

# The tests that cover the diff. make coverage writes the coverage map.
# The map has one entry for each test JVM. Set forkEvery = 1 on the test task.
TEST_CHANGED_CMD = chosen=$$($(PYTHON) .claude/skills/project-report/scripts/changed_tests.py --print) || exit 1; \
	chosen=$$(printf '%s' "$$chosen" | tr '\n' ' '); \
	if [ -z "$$chosen" ]; then printf '%s\n' "test-changed: no test covers the changed files. make test runs the full suite."; \
	else printf 'test-changed: %s\n' "$$chosen"; args=""; for name in $$chosen; do args="$$args --tests $$name"; done; $(GRADLE) test $$args; fi

# This makefile writes its own recipes for the contract and image
# targets, so sdlc.mk leaves its shared ones out.
SDLC_OWN_CONTRACT = 1
include .claude/skills/github-pipeline/sdlc.mk

setup: ## Match CI: resolve Gradle dependencies into the Gradle cache
	@$(call SDLC_LOG,setup,_setup)

build: ## Match CI: build the runnable JAR and stage it in build/dist
	@$(call SDLC_LOG,build,_build)

test: ## Match CI: unit tests, JUnit XML under build/
	@$(call SDLC_LOG,test,_test)

.PHONY: editorconfig format lint integration coverage

editorconfig: ## Check .editorconfig
	$(EDITORCONFIG)

format: ## Run google-java-format, the one formatter
	$(GRADLE) spotlessCheck

lint: ## Run Checkstyle, the one linter
	$(GRADLE) checkstyleMain

integration: ## Run the one integration entry
	$(GRADLE) integrationTest

coverage: ## diff-cover report of the lines this change touched
	@set -eu; \
	mkdir -p build/coverage; \
	$(GRADLE) test jacocoTestReport; \
	$(PYTHON) .claude/skills/project-report/scripts/jacoco_cover_map.py; \
	base=$$(git merge-base HEAD origin/$(DEFAULT_BRANCH) 2>/dev/null || git rev-parse -q --verify HEAD 2>/dev/null || git hash-object -t tree /dev/null); \
	git add -N .; \
	git diff "$$base" > build/coverage/change.diff; \
	report=$$(find build -name jacocoTestReport.xml | head -n 1); \
	test -n "$$report"; \
	REPORT="$$report" $(DIFF_COVER)

docs: ## Match CI: render docs/ to HTML under build/docs
	@$(call SDLC_LOG,docs,_docs)

image: ## Build the image from the tested JAR. No Gradle, no push
	@set -eu; \
	test -f build/dist/$(NAME).jar; \
	rm -rf build/image-context; \
	mkdir -p build/image-context; \
	cp build/dist/$(NAME).jar build/image-context/app.jar; \
	cp Containerfile build/image-context/Containerfile; \
	podman build -f build/image-context/Containerfile --build-arg JRE_IMAGE=$(JRE_IMAGE) \
		--label org.opencontainers.image.source="https://github.com/$(PACKAGE)" \
		-t "$(CI_IMAGE)" build/image-context

.PHONY: login
login: ## Match CI: log in to ghcr.io with REGISTRY_USER and REGISTRY_TOKEN
	@set -eu; \
	test -n "$${REGISTRY_USER:-}" || { echo "REGISTRY_USER is required" >&2; exit 1; }; \
	test -n "$${REGISTRY_TOKEN:-}" || { echo "REGISTRY_TOKEN is required" >&2; exit 1; }; \
	printf '%s\n' "$$REGISTRY_TOKEN" | podman login ghcr.io --username "$$REGISTRY_USER" --password-stdin

publish-container: ## Match CI: push the version, and latest on the default branch
	@$(call SDLC_LOG,publish-container,_publish-container)

publish-github: ## Match CI: release MAJOR.MINOR.PATCH-run with the tested JAR
	@$(call SDLC_LOG,publish-github,_publish-github)

clean: ## Remove build/ and .gradle/
	rm -rf build .gradle

_setup:
	@$(MAKE) --no-print-directory doctor
	@set -eu; \
	mkdir -p "$$HOME/.gradle"; \
	$(GRADLE) --version; \
	$(GRADLE) dependencies --configuration runtimeClasspath > build/logs/dependencies.txt; \
	printf '# setup\n\nDependencies resolved into the Gradle cache.\n' > build/summaries/setup.md

_build:
	@set -eu; \
	$(GRADLE) assemble; \
	jars=$$(ls $(JAR_GLOB) 2>/dev/null | grep -v -- '-original.jar$$' || true); \
	test "$$(printf '%s\n' "$$jars" | grep -c .)" -eq 1; \
	mkdir -p build/dist; \
	cp "$$jars" build/dist/$(NAME).jar; \
	printf '# build\n\nJAR build/dist/%s.jar\n' "$(NAME)" > build/summaries/build.md

_test:
	@set -eu; \
	$(GRADLE) test; \
	printf '# test\n\nJUnit XML in build/test-results.\n' > build/summaries/test.md

_docs:
	@set -eu; \
	mkdir -p build/docs; \
	if find docs -name '*.md' 2>/dev/null | grep -q .; then $(PYTHON) scripts/render-docs.py docs build/docs; fi; \
	printf '# docs\n\n%s HTML files.\n' "$$(find build/docs -type f | wc -l | tr -d ' ')" > build/summaries/docs.md

_publish-container:
	@set -eu; \
	$(THIS_MAKE) --no-print-directory image; \
	version=$$($(THIS_MAKE) -s --no-print-directory version); \
	mkdir -p build; \
	printf '%s\n' "$$version" > build/publish-version.txt; \
	tags=$$($(THIS_MAKE) -s --no-print-directory publish-tags); \
	for tag in $$tags; do \
	  podman tag "$(CI_IMAGE)" "$(IMAGE):$$tag"; \
	  podman push "$(IMAGE):$$tag"; \
	done; \
	shown=$$(printf '%s\n' "$$tags" | sed 's/^/- /'); \
	printf '# publish-container\n\nStatus: pushed\nImage: %s\nTags:\n%s\n' "$(IMAGE)" "$$shown" > build/summaries/publish-container.md

_publish-github:
	@set -eu; \
	test -f build/dist/$(NAME).jar; \
	version=$$($(THIS_MAKE) -s --no-print-directory version); \
	asset=build/dist/$(NAME)-$$version.jar; \
	cp build/dist/$(NAME).jar "$$asset"; \
	if gh release view "$$version" >/dev/null 2>&1; then \
	  gh release upload "$$version" "$$asset" --clobber; \
	else \
	  gh release create "$$version" "$$asset" --title "$$version" \
	    --notes "Build $$version." --target "$$(git rev-parse HEAD)"; \
	fi; \
	printf '# publish-github\n\nStatus: released\nRelease: %s\n' "$$version" > build/summaries/publish-github.md
