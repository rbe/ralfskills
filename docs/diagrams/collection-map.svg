<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="The agent reads CLAUDE.md in every session. CLAUDE.md names the skills and imports rules.md of r-project-setup. The agent loads a skill. The skill steps tell the agent to type make targets and Git commands. Make runs every tool in a Podman image, or from PATH in host mode. The skill r-record writes the board and the glossary under docs. A Git push passes the pre-push hook and starts a GitHub Actions workflow, and the workflow runs the same make targets.">
  <title>How the parts of ralfskills work together</title>
<style>
  svg { --bg: #f5f6f8; --surface: #ffffff; --fg: #1b2230; --muted: #586377; --line: #c3cad6; --accent: #a8500a; --accent-bg: #fbeedd; }
  @media (prefers-color-scheme: dark) { svg { --bg: #11151c; --surface: #1a2029; --fg: #e7eaf0; --muted: #9ca8ba; --line: #394354; --accent: #f0a850; --accent-bg: #33270f; } }
  .backdrop { fill: var(--surface); }
  .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .group { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .pill { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
  .hinge { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2; }
  .arr { fill: none; stroke: var(--fg); stroke-width: 1.4; }
  .arr.dash { stroke-dasharray: 5 4; }
  .head { fill: var(--fg); }
  .h { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: var(--fg); }
  .t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: var(--fg); }
  .m { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: var(--muted); }
  .c { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: var(--fg); }
  .l { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: var(--fg); }
  .acc { fill: var(--accent); }
</style>
  <rect class="backdrop" x="0" y="0" width="1080" height="600"/>
  <defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path class="head" d="M0 0 L10 5 L0 10 z"/>
  </marker>
  </defs>

  <!-- Row 1: CLAUDE.md, agent, you -->
  <rect class="box" x="20" y="30" width="210" height="60" rx="4"/>
  <text class="h" x="125" y="56" text-anchor="middle">CLAUDE.md</text>
  <text class="m" x="125" y="75" text-anchor="middle">skill names, imports rules.md</text>

  <rect class="box" x="430" y="30" width="220" height="60" rx="4"/>
  <text class="h" x="540" y="56" text-anchor="middle">Agent</text>
  <text class="m" x="540" y="75" text-anchor="middle">one session, one task</text>

  <rect class="box" x="880" y="30" width="180" height="60" rx="4"/>
  <text class="h" x="970" y="56" text-anchor="middle">You</text>
  <text class="m" x="970" y="75" text-anchor="middle">the owner of the project</text>

  <line class="arr" x1="230" y1="60" x2="428" y2="60" marker-end="url(#ah)"/>
  <text class="l" x="330" y="52" text-anchor="middle">read in every session</text>

  <line class="arr" x1="880" y1="48" x2="652" y2="48" marker-end="url(#ah)"/>
  <text class="l" x="766" y="40" text-anchor="middle">request</text>
  <line class="arr" x1="650" y1="74" x2="878" y2="74" marker-end="url(#ah)"/>
  <text class="l" x="766" y="91" text-anchor="middle">reply, question, decision to make</text>

  <!-- Row 2: skills -->
  <line class="arr" x1="540" y1="90" x2="540" y2="138" marker-end="url(#ah)"/>
  <text class="l" x="552" y="119">loads the skill that the task needs</text>

  <rect class="box" x="340" y="140" width="400" height="150" rx="4"/>
  <text class="h" x="360" y="164">Skills</text>
  <text class="c" x="412" y="164">.claude/skills/r-&lt;name&gt;/SKILL.md</text>

  <rect class="pill" x="360" y="178" width="78" height="28" rx="14"/>
  <text class="t" x="399" y="196" text-anchor="middle">r-plan</text>
  <rect class="pill" x="454" y="178" width="78" height="28" rx="14"/>
  <text class="t" x="493" y="196" text-anchor="middle">r-develop</text>
  <rect class="pill" x="548" y="178" width="78" height="28" rx="14"/>
  <text class="t" x="587" y="196" text-anchor="middle">r-review</text>
  <rect class="pill" x="642" y="178" width="78" height="28" rx="14"/>
  <text class="t" x="681" y="196" text-anchor="middle">r-release</text>
  <line class="arr" x1="438" y1="192" x2="452" y2="192" marker-end="url(#ah)"/>
  <line class="arr" x1="532" y1="192" x2="546" y2="192" marker-end="url(#ah)"/>
  <line class="arr" x1="626" y1="192" x2="640" y2="192" marker-end="url(#ah)"/>

  <text class="t" x="360" y="232">r-record · r-project-setup · r-github-pipeline · r-onboard</text>
  <text class="t" x="360" y="252">r-board-merge · languages · r-security, r-privacy, …</text>
  <text class="m" x="360" y="275">Each skill: numbered steps and rules in XML tags.</text>

  <!-- Board -->
  <rect class="box" x="20" y="180" width="210" height="120" rx="4"/>
  <text class="h" x="36" y="204">Board</text>
  <text class="c" x="84" y="204">docs/</text>
  <text class="t" x="36" y="228">ROADMAP · proposals/ · adr/</text>
  <text class="t" x="36" y="246">requirements/ · history/</text>
  <text class="t" x="36" y="264">glossary.md</text>
  <text class="m" x="36" y="282">make test checks that each test</text>
  <text class="m" x="36" y="296">names the id that it proves.</text>

  <line class="arr" x1="340" y1="232" x2="232" y2="232" marker-end="url(#ah)"/>
  <text class="l" x="286" y="224" text-anchor="middle">r-record writes</text>
  <text class="l" x="286" y="248" text-anchor="middle">ids, documents</text>

  <!-- Row 3: Make -->
  <line class="arr" x1="440" y1="290" x2="440" y2="358" marker-end="url(#ah)"/>
  <text class="l" x="450" y="318">agent types only</text>
  <text class="c" x="450" y="335">make &lt;target&gt;</text>
  <text class="l" x="546" y="335">and Git</text>

  <line class="arr dash" x1="660" y1="290" x2="660" y2="358" marker-end="url(#ah)"/>
  <text class="l" x="670" y="318">ship the</text>
  <text class="l" x="670" y="335">makefiles</text>

  <rect class="hinge" x="340" y="360" width="400" height="74" rx="4"/>
  <text class="h acc" x="360" y="384">Make: the only interface</text>
  <text class="c" x="360" y="405">help · setup · test-changed · gates · image</text>
  <text class="m" x="360" y="424">The Makefile includes project.mk and sdlc.mk.</text>

  <polyline class="arr" points="340,397 125,397 125,302" marker-end="url(#ah)"/>
  <text class="c" x="234" y="389" text-anchor="middle">make toon, links, ids, req</text>
  <text class="l" x="234" y="414" text-anchor="middle">index, check, and print the board</text>

  <!-- Row 4: Podman -->
  <line class="arr" x1="540" y1="434" x2="540" y2="498" marker-end="url(#ah)"/>
  <text class="c" x="552" y="463">podman run</text>
  <text class="l" x="552" y="480">every tool, in a pinned image</text>

  <rect class="box" x="340" y="500" width="400" height="70" rx="4"/>
  <text class="h" x="360" y="526">Podman images, or PATH with TOOLS=host</text>
  <text class="t" x="360" y="549">ruff · python · go · node · gradle · apm · gh · curl</text>

  <!-- GitHub -->
  <rect class="group" x="880" y="150" width="180" height="420" rx="4"/>
  <text class="h" x="896" y="174">GitHub</text>

  <rect class="box" x="895" y="200" width="150" height="50" rx="4"/>
  <text class="t" x="970" y="230" text-anchor="middle">repository</text>

  <rect class="box" x="895" y="372" width="150" height="50" rx="4"/>
  <text class="t" x="970" y="393" text-anchor="middle">Actions workflow</text>
  <text class="m" x="970" y="410" text-anchor="middle">ci.yml</text>

  <rect class="box" x="895" y="510" width="150" height="50" rx="4"/>
  <text class="t" x="970" y="531" text-anchor="middle">API · registry</text>
  <text class="t" x="970" y="548" text-anchor="middle">releases</text>

  <line class="arr" x1="740" y1="225" x2="893" y2="225" marker-end="url(#ah)"/>
  <text class="c" x="817" y="217" text-anchor="middle">git push</text>
  <text class="m" x="811" y="242" text-anchor="middle">pre-push hook checks</text>

  <line class="arr" x1="970" y1="250" x2="970" y2="370" marker-end="url(#ah)"/>
  <text class="l" x="980" y="314">on push</text>

  <line class="arr" x1="895" y1="397" x2="742" y2="397" marker-end="url(#ah)"/>
  <text class="l" x="817" y="389" text-anchor="middle">runs the same</text>
  <text class="l" x="817" y="414" text-anchor="middle">make targets</text>

  <line class="arr" x1="740" y1="535" x2="893" y2="535" marker-end="url(#ah)"/>
  <text class="l" x="817" y="527" text-anchor="middle">gh and podman push</text>
  <text class="c" x="811" y="552" text-anchor="middle">ci-status,</text>
  <text class="c" x="811" y="566" text-anchor="middle">pull-request,</text>
  <text class="c" x="811" y="580" text-anchor="middle">publish-container</text>
</svg>
